name: Private Meetings support
about: Report a reproducible app problem without sharing private meeting content.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Private Meetings issue.

        **Do not include meeting recordings, transcripts, summaries, credentials, API keys, private hostnames, or confidential context.** This is a public repository.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.x"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture and permissions
        - Microphone selection
        - Local model download or verification
        - Transcription and diarization
        - Local summary
        - Import
        - Meeting library or playback
        - Purge or deletion
        - Advanced Remote
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or non-sensitive details only.
      placeholder: |
        1. Opened…
        2. Selected…
        3. Observed…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and non-sensitive error text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed meeting content, personal information, credentials, private endpoints, and other confidential data.
          required: true
